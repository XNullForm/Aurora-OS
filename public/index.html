renderers.snake=w=>{let area=el('div','game-area'),label=el('div','h2'),canvas=el('canvas'),controls=el('div','game-controls');canvas.width=300;canvas.height=300;area.append(label,canvas,controls);w.body.append(area);let ctx=canvas.getContext('2d'),snake,dir,next,food,score,running=false,dead=false,timer;function spawn(){let free=[];for(let y=0;y<15;y++)for(let x=0;x<15;x++)if(!snake.some(s=>s.x===x&&s.y===y))free.push({x,y});return free[Math.floor(Math.random()*free.length)]}function draw(){ctx.fillStyle='#10182a';ctx.fillRect(0,0,300,300);ctx.strokeStyle='#ffffff0a';for(let i=0;i<15;i++){ctx.beginPath();ctx.moveTo(i*20,0);ctx.lineTo(i*20,300);ctx.moveTo(0,i*20);ctx.lineTo(300,i*20);ctx.stroke()}if(food){ctx.fillStyle='#f4a1af';ctx.beginPath();ctx.arc(food.x*20+10,food.y*20+10,7,0,Math.PI*2);ctx.fill()}snake.forEach((s,i)=>{ctx.fillStyle=i?'#59b99a':'#a1f0ce';ctx.fillRect(s.x*20+2,s.y*20+2,16,16)});label.textContent='Score: '+score+(dead?' · Game over':!running?' · Ready':'')}function reset(){snake=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];dir=next={x:1,y:0};score=0;food=spawn();dead=false;running=false;draw()}function tick(){if(!running||w.node.classList.contains('minimized'))return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eat=food&&h.x===food.x&&h.y===food.y;if(h.x<0||h.y<0||h.x>=15||h.y>=15||snake.slice(0,eat?snake.length:-1).some(s=>s.x===h.x&&s.y===h.y)){dead=true;running=false;draw();return}snake.unshift(h);if(eat){score++;food=spawn();if(!food){running=false;dead=true}}else snake.pop();draw()}function turn(x,y){if(!dead){if(x!==-dir.x||y!==-dir.y)next={x,y};running=true;draw()}}let key=e=>{if(active!==w.id)return;let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();turn(...d)}};document.addEventListener('keydown',key);for(let [s,x,y] of [['←',-1,0],['↑',0,-1],['↓',0,1],['→',1,0]])controls.append(btn(s,()=>turn(x,y)));controls.append(btn('Restart',()=>{reset();running=true},'refresh'));reset();timer=setI renderers.tictac=w=>{let area=el('div','game-area'),label=el('div','h2'),grid=el('div','ttt-grid');area.append(label,grid,btn('New game',reset,'refresh'));w.body.append(area);let cells,turn,over;function reset(){cells=Array(9).fill('');turn='X';over=false;render()}function render(){grid.innerHTML='';let lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],win=lines.find(l=>cells[l[0]]&&l.every(i=>cells[i]===cells[l[0]]));over=!!win||cells.every(Boolean);label.textContent=win?cells[win[0]]+' wins!':over?'Draw!':turn+' to move';cells.forEach((v,i)=>{let b=el('button','',v);b.setAttribute('aria-label','Cell '+(i+1));b.disabled=!!v||over;b.onclick=()=>{cells[i]=turn;turn=turn==='X'?'O':'X';render()};grid.append(b)})}reset()};
renderers.paint=w=>{let bar=toolBar(w.body),main=el('div','game-area'),c=el('canvas');c.width=800;c.height=480;c.style.background='#fff';let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);main.append(c);w.body.append(main);let color=el('input');color.type='color';color.value='#345ed2';let size=el('input');size.type='range';size.min=1;size.max=45;size.value=6;size.title='Brush size';let down=false,last;function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);down=true;last=point(e);ctx.fillStyle=color.value;ctx.beginPath();ctx.arc(...last,+size.value/2,0,Math.PI*2);ctx.fill()};c.onpointermove=e=>{if(!down)return;let p=point(e);ctx.strokeStyle=color.value;ctx.lineWidth=+size.value;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p};c.onpointerup=c.onpointercancel=()=>down=false;bar.append(color,size,btn('Clear',()=>{ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height)}),btn('Save to Photos',()=>{let parent=availableFile(findFile('pictures'))?'pictures':'root',f={id:uid(),parent,name:'Sketch-'+Date.now()+'.png',type:'binary',mime:'image/png',data:c.toDataURL()};files.push(f);persistFiles();toast('Sketch saved',f.name)},'check','primary'),btn('Export',()=>c.toBlob(b=>download('sketch.png',b),'image/png'),'download'))};
